# Install in the customer's TLS gateway. Replace domain and certificate paths.
server {
    listen 443 ssl;
    server_name sso-adapter.customer.example;
    ssl_certificate /etc/nginx/certs/adapter-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/adapter-key.pem;
    # Authorization codes must not appear in access logs.
    access_log off;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
    }
}
